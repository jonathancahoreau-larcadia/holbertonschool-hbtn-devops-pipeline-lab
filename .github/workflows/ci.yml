# ---------------------------------------------------------------------------
# CI/CD pipeline for hbtn-devops-pipeline-lab
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pipeline
          POSTGRES_PASSWORD: pipeline
          POSTGRES_DB: pipeline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pipeline -d pipeline"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run the unit tests
        run: npm run test:unit

      - name: Run tests
        env:
          DATABASE_URL: postgresql://pipeline:pipeline@localhost:5432/pipeline
          JEST_JUNIT_OUTPUT_DIR: ./reports
        run: npm test -- --reporters=default --reporters=jest-junit

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: ./reports/
          retention-days: 7

  build:
    name: Build and Publish
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Staging
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deploy
        run: |
          curl -f -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}'

      - name: Verify staging
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          MAX_ATTEMPTS=20
          WAIT_SECONDS=15

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "Verification attempt $attempt/$MAX_ATTEMPTS"

            HEALTH_CODE=$(curl -sS -o /dev/null -w "%{http_code}" "$STAGING_URL/health" || true)
            ITEMS_CODE=$(curl -sS -o /dev/null -w "%{http_code}" "$STAGING_URL/items" || true)

            if [ -z "$HEALTH_CODE" ]; then
              HEALTH_CODE="000"
            fi

            if [ -z "$ITEMS_CODE" ]; then
              ITEMS_CODE="000"
            fi

            echo "/health -> $HEALTH_CODE"
            echo "/items  -> $ITEMS_CODE"

            if [ "$HEALTH_CODE" = "200" ] && [ "$ITEMS_CODE" = "200" ]; then
              echo "Staging verification succeeded."
              exit 0
            fi

            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "Staging is not ready yet. Waiting ${WAIT_SECONDS}s..."
              sleep "$WAIT_SECONDS"
            fi
          done

          echo "Staging verification failed."
          exit 1
